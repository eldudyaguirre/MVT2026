<body>
  <main class="login-container">
    <div class="login-logo"><img src="../img/logonuevov2.svg?v=20260909" alt="MAVTRONIC"></div>
    <h1>Inicio de Sesión</h1>

<form id="loginForm">

  <div class="field">
    <label for="empresa">Empresa</label>
    <div class="empresa-select" id="empresaSelect">
      <select id="empresa" name="empresa" required aria-hidden="true" tabindex="-1">
        <option value="0103749594001">0103749594001</option>
        <option value="0195141177001">0195141177001</option>
      </select>
      <button type="button" class="empresa-select-button" id="empresaSelectButton" aria-haspopup="listbox" aria-expanded="false">
        <span id="empresaSelectValue">0103749594001</span>
        <span class="empresa-select-arrow" aria-hidden="true"></span>
      </button>
      <div class="empresa-select-menu" id="empresaSelectMenu" role="listbox" aria-label="Empresa">
        <button type="button" class="empresa-option selected" data-value="0103749594001" role="option" aria-selected="true">0103749594001</button>
        <button type="button" class="empresa-option" data-value="0195141177001" role="option" aria-selected="false">0195141177001</button>
      </div>
    </div>
  </div>

  <div class="field">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" placeholder="Usuario" autocomplete="username" required>
  </div>

  <div class="field">
    <label for="clave">Contraseña</label>
    <input type="password" id="clave" name="clave" placeholder="••••••••" autocomplete="current-password" required>
  </div>

  <label class="show-password">
    <input type="checkbox" id="checkbox">
    <span>Mostrar contraseña</span>
  </label>

  <button type="submit" id="submit">Iniciar sesión</button>
  <div id="mensaje"></div>

</form>
  </main>

  <script src="/js/login.js?v=20260930b"></script>
</body>
</html>
